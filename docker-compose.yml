services:
  osiris-web:
    build:
      context: .
    ports:
      - "127.0.0.1:25000:25000"
    environment:
      PYTHONUNBUFFERED: "1"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    shm_size: 512mb
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:25000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
