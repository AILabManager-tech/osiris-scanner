name: OSIRIS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: osiris-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .
      - run: bandit -q -r . -x ./tests
      - run: pip-audit
      - run: python -m build
      - name: Verify built wheel in a clean environment
        run: |
          python -m venv /tmp/osiris-wheel
          /tmp/osiris-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/osiris-wheel/bin/python -c "import scanner, scoring, report, history, calibrate, webapp; from importlib.resources import files; assert files('blocklists').joinpath('trackers.json').is_file(); assert files('calibration').joinpath('sites.txt').is_file(); assert files('osiris_web').joinpath('static', 'index.html').is_file()"
          /tmp/osiris-wheel/bin/osiris --help
          /tmp/osiris-wheel/bin/osiris-web --help
          /tmp/osiris-wheel/bin/osiris-calibrate --help
      - name: Verify built sdist in a clean environment
        run: |
          python -m venv /tmp/osiris-sdist
          /tmp/osiris-sdist/bin/pip install dist/*.tar.gz
          cd /tmp
          /tmp/osiris-sdist/bin/python -c "import scanner, scoring, report, history, calibrate, webapp; from importlib.resources import files; assert files('blocklists').joinpath('trackers.json').is_file(); assert files('calibration').joinpath('sites.txt').is_file(); assert files('osiris_web').joinpath('static', 'index.html').is_file()"
          /tmp/osiris-sdist/bin/osiris --help
          /tmp/osiris-sdist/bin/osiris-web --help
          /tmp/osiris-sdist/bin/osiris-calibrate --help
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: osiris-python-package
          path: dist/*
          if-no-files-found: error

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
